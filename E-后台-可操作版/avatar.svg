<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="penquan">
<!-- ===========================================================================
     卡通头像（扁平插画风，纯矢量，不含位图）。
     为什么手绘 SVG 而不是用首字母圆片：首字母圆片就是「假头像」本身 ——
     真实后台右上角是用户自己上传的照片/头像，一个「运」字方块一眼就是占位符。
     为什么不用 DiceBear/Gravatar 这类外链：展会现场没有可靠外网，
     而且这一版所有资产都必须自包含（离线可跑）。
     配色刻意用暖色系（发/衣），和界面的冷主题色 #00D3A7 区分开，
     28px 圆形裁切后仍能看出是一个人（关键是发型轮廓 + 衣领 V 字）。
     =========================================================================== -->
<defs>
  <clipPath id="pqClip"><circle cx="48" cy="48" r="48"/></clipPath>
  <linearGradient id="pqBg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#2E6E7E"/>
    <stop offset="1" stop-color="#1D4F5E"/>
  </linearGradient>
  <linearGradient id="pqTop" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#F2A65A"/>
    <stop offset="1" stop-color="#E08A3C"/>
  </linearGradient>
</defs>
<g clip-path="url(#pqClip)">
  <rect width="96" height="96" fill="url(#pqBg)"/>
  <!-- 肩 / 上衣 -->
  <path d="M48 63c17.5 0 31 10.5 33.5 25.5L84 96H12l2.5-7.5C17 73.5 30.5 63 48 63z" fill="url(#pqTop)"/>
  <!-- 衣领 V 字（小尺寸下靠它读出「这是个人」） -->
  <path d="M39.5 65.5 48 79l8.5-13.5-8.5-3z" fill="#F7EFE6"/>
  <!-- 脖子 -->
  <path d="M41.5 54h13v11c0 2-2.9 3.6-6.5 3.6S41.5 67 41.5 65V54z" fill="#E8B08A"/>
  <!-- 脸 -->
  <ellipse cx="48" cy="41" rx="16.5" ry="18" fill="#F6C9A4"/>
  <!-- 耳 -->
  <ellipse cx="31.6" cy="42.5" rx="3.1" ry="4.2" fill="#EEB88F"/>
  <ellipse cx="64.4" cy="42.5" rx="3.1" ry="4.2" fill="#EEB88F"/>
  <!-- 头发：偏分短发。轮廓是小尺寸下最强的识别特征 -->
  <path d="M48 19c11.6 0 18.4 7.2 18.4 17.2 0 2.4-.4 4.6-.9 6.2l-2.6-1.1c.3-6.6-1.4-9.6-4.3-11.2-3 2.2-8 3.4-14.2 3.4-4.5 0-7.6-.6-9.9-1.6-2 2-3 5-2.8 9.4l-2.6 1.1c-.6-1.8-1-4-1-6.5C28.1 25.6 36 19 48 19z" fill="#3B2A22"/>
  <!-- 眉 -->
  <path d="M38.4 36.6c1.9-.9 4.1-.9 6 .1M51.6 36.7c1.9-1 4.1-1 6-.1" stroke="#3B2A22" stroke-width="2.1" stroke-linecap="round" fill="none"/>
  <!-- 眼（圆点 + 高光，卡通感来自这里） -->
  <circle cx="41.4" cy="42.4" r="2.7" fill="#2A2320"/>
  <circle cx="54.6" cy="42.4" r="2.7" fill="#2A2320"/>
  <circle cx="42.3" cy="41.5" r=".95" fill="#FFFFFF"/>
  <circle cx="55.5" cy="41.5" r=".95" fill="#FFFFFF"/>
  <!-- 鼻 -->
  <path d="M48 44.5v3.4" stroke="#DDA57C" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- 嘴：微笑 -->
  <path d="M43.4 51.6c1.5 2 7.7 2 9.2 0" stroke="#B5654B" stroke-width="2.1" stroke-linecap="round" fill="none"/>
  <!-- 腮红 -->
  <ellipse cx="37.4" cy="47.6" rx="3.1" ry="1.8" fill="#EF9E86" opacity=".5"/>
  <ellipse cx="58.6" cy="47.6" rx="3.1" ry="1.8" fill="#EF9E86" opacity=".5"/>
</g>
</svg>
